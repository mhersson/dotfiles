# vim:ft=kitty

## name:    Copper Light
## blurb:   ContextMatrix Copper palette - cool neutral greys with a copper accent

# The basic colors
foreground              #25232b
background              #ffffff
selection_foreground    #25232b
selection_background    #edcfc5

# Cursor colors
cursor                  #a83d17
cursor_text_color       #ffffff

# URL underline color when hovering with mouse
url_color               #a83d17

# Kitty window border colors
active_border_color     #a83d17
inactive_border_color   #ccc6d3
bell_border_color       #855313

# Tab bar colors

font_family      family='RobotoMono Nerd Font' style=Medium
bold_font        family='RobotoMono Nerd Font' style=Bold
italic_font      family='RobotoMono Nerd Font' style='Medium Italic'
bold_italic_font family='RobotoMono Nerd Font' style='Bold Italic'

font_size 14

# Match Ghostty: no gamma/contrast thickening (macOS default is "1.7 30")
text_composition_strategy 1.7 0

# Match Ghostty's cell size: kitty rounds fractional cell metrics up (8.4px -> 9px
# on 1x displays), Ghostty rounds to nearest, giving tighter letter spacing
modify_font cell_width  -1px
modify_font cell_height -1px

cursor_shape beam
cursor_stop_blinking_after 0

scrollback_lines 5000

copy_on_select yes

strip_trailing_spaces smart

focus_follows_mouse yes

enable_audio_bell no
window_alert_on_bell no

remember_window_size  no
initial_window_width  750
initial_window_height 550


window_margin_width 5
window_padding_width 5

active_border_color #ff9940
inactive_border_color #ccc

hide_window_decorations no

tab_bar_style powerline
tab_powerline_style angled
tab_title_max_length 30

include ./themes/Catppuccin-Latte.conf

# wayland_titlebar_color background

enabled_layouts *



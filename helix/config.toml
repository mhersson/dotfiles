theme = "ayu_mirage"

[editor]
bufferline = "multiple"
cursorline = true
color-modes = true
true-color = true
rainbow-brackets = true
rounded-corners = true
popup-border = "all"

# copilot
inline-completion-timeout = 150

# Minimum severity to show a diagnostic after the end of a line
end-of-line-diagnostics = "error"

[editor.lsp]
mpls-focus-notify = true

[editor.inline-blame]
show = "cursor-line"
auto-fetch = true

[editor.inline-diagnostics]
cursor-line = "info" # Show inline diagnostics when the cursor is on the line
other-lines = "disable" # Don't expand diagnostics unless the cursor is on the line

[editor.auto-pairs]
"(" = ")"
"[" = "]"
"{" = "}"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true

[editor.indent-guides]
render = true

[editor.statusline]
left = ["mode", "spacer", "spinner", "version-control", "file-name"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["info", "warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.breadcrumb]
enable = false
path = "none"

[icons.fs]
enable = true

[icons.kind]
enable = true

[icons.vcs]
enable = true

[keys.insert]
A-tab = "inline_completion_accept"
C-e = "inline_completion_dismiss"

[keys.normal]
H = "goto_previous_buffer"
L = "goto_next_buffer"
A-q = ":reflow"
C-r = ":reload-all"
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output printf "\033[?1049h\033[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

[keys.normal.space]
"," = "buffer_picker"
space = "file_picker"
f = "file_picker_in_current_buffer_directory"
i = { label = "Toggle inlay hints", command = ":toggle lsp.display-inlay-hints" }
m = { label = "Markdown preview", command = ":lsp-workspace-command open-preview" }

[keys.normal.space.b]
label = "Buffer"
b = "buffer_picker"
R = { label = "Reload all", command = ":reload-all" }
d = { label = "Close", command = ":buffer-close" }
k = { label = "Force close", command = ":buffer-close!" }
o = { label = "Close others", command = ":buffer-close-others" }
p = { label = "Switch project", command = [
    ":open %sh{~/.config/helix/utils/switch-project.sh show-picker}",
    ":change-current-directory %sh{~/.config/helix/utils/switch-project.sh}",
    # ":buffer-close-all",
    ":redraw",
    ":reload-all"
] }
r = { label = "Reload", command = ":reload" }

[keys.normal.space.g]
label = "Git"
f = "changed_file_picker"
g = { label = "Termagit", command = [
    ":write-all",
    ":new",
    ":insert-output termagit",
    ':insert-output printf "\033[?1049h\033[?2004h" > /dev/tty',
    ":set mouse false", # First disable mouse to hint helix into activating it
    ":set mouse true",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
] }
